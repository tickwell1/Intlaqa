<style>
/* Layout: sticky header with a menu button that opens a centered popup; one column of cards that goes two-up on wide screens; an amber craving button floats at the bottom. Night palette is primary, day palette follows the viewer. */
:root{
  --bg:#0F1B24; --surface:#162833; --pop:#1C3340; --line:#264452;
  --accent:#2A9D8F; --accent-hi:#5CC8BA; --craving:#F4A261; --good:#6BCB8B; --warn:#E9C46A;
  --fg:#E8F1F2; --fg2:#9DB4BF; --scrim:rgba(5,12,18,.7);
  --on-accent:#06201D; --on-craving:#2A1608;
  --font-ui:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --font-text:'Amiri','Traditional Arabic','Scheherazade New',serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F8F9; --surface:#FFFFFF; --pop:#FFFFFF; --line:#D5E3E7;
    --accent:#1F7A72; --accent-hi:#1F7A72; --craving:#D9622F; --good:#2E9E5B; --warn:#C99A1F;
    --fg:#14303B; --fg2:#5B7580; --scrim:rgba(10,25,32,.45);
    --on-accent:#FFFFFF; --on-craving:#FFFFFF; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F4F8F9; --surface:#FFFFFF; --pop:#FFFFFF; --line:#D5E3E7;
  --accent:#1F7A72; --accent-hi:#1F7A72; --craving:#D9622F; --good:#2E9E5B; --warn:#C99A1F;
  --fg:#14303B; --fg2:#5B7580; --scrim:rgba(10,25,32,.45);
  --on-accent:#FFFFFF; --on-craving:#FFFFFF; color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.65 var(--font-ui);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
.wrap{max-width:960px;margin-inline:auto}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line);max-width:960px;margin-inline:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:19px}
.brand svg{display:block}
.sec{margin-inline-start:auto;color:var(--fg2);font-size:14px}
.ibtn{width:44px;height:44px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);padding:0}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{max-width:960px;margin-inline:auto;padding-block:18px 130px;min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card+.card,.stack>*+*{margin-top:0}
.stack{display:flex;flex-direction:column;gap:16px}
h2{margin:0 0 12px;font-size:17px;font-weight:600;line-height:1.4}
h3{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--fg2)}
p{margin:0 0 10px}
.muted{color:var(--fg2);font-size:14px}
.hero{text-align:center;padding:10px 0 20px}
.hero svg{display:block;margin:0 auto 6px}
.eyebrow{color:var(--fg2);font-size:15px;margin:0;letter-spacing:.02em}
.big{font-size:clamp(76px,24vw,132px);line-height:1.05;font-weight:300;color:var(--accent-hi);margin:0;font-variant-numeric:tabular-nums}
.sub{color:var(--fg2);margin:0 0 14px;font-variant-numeric:tabular-nums}
.line{max-width:44ch;margin:0 auto;font-size:17px}
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;min-width:0}
.cell b{display:block;font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.cell span{font-size:13px;color:var(--fg2);line-height:1.35;display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.chip{min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.sq{min-width:44px;padding-inline:0;text-align:center}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.full{width:100%}
label.lb{display:block;font-size:14px;color:var(--fg2);margin:12px 0 6px}
input[type=text],input[type=time],input[type=date],input[type=datetime-local],input[type=password],select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
textarea{min-height:84px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;min-height:40px;padding:0 16px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.li{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li>div{min-width:0}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--fg2);margin-inline-end:4px}
.tag.ok{border-color:var(--good);color:var(--good)}
.tag.rl{border-color:var(--warn);color:var(--warn)}
.sc{margin:0 0 12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.sc blockquote{margin:0;font:400 25px/2 var(--font-text);text-align:center}
.sc figcaption{margin-top:4px;font-size:13px;color:var(--fg2);text-align:center}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.win{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.win:first-child{border-top:0}
.win .dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:14px;color:var(--fg2)}
.win.on .dot{border-color:var(--good);color:var(--good)}
.win.next .dot{border-color:var(--accent-hi);color:var(--accent-hi)}
.win>div{flex:1;min-width:0}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:320px;height:auto}
.chart text{fill:var(--fg2);font:11px var(--font-ui)}
#fab{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;pointer-events:none;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#fab button{pointer-events:auto;width:min(100%,440px);min-height:56px;border:0;border-radius:14px;background:var(--craving);color:var(--on-craving);font-weight:600;font-size:18px}
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scrim.solid{background:var(--bg)}
.dlg{background:var(--pop);border:1px solid var(--line);border-radius:18px;width:min(100%,460px);max-height:100%;overflow:auto;padding:18px}
.dlg.wide{width:min(100%,600px)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.dh b{font-size:18px;font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mi{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:92px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px}
.mi svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mi[aria-current="page"]{border-color:var(--accent-hi);color:var(--accent-hi)}
.timer{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:center;margin-bottom:14px}
.ring{position:relative;width:140px;height:140px}
.ring svg{width:140px;height:140px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:400;font-variant-numeric:tabular-nums}
.breath{position:relative;width:140px;height:140px;display:grid;place-items:center}
.breath i{position:absolute;width:96px;height:96px;border-radius:50%;border:2px solid var(--accent-hi);background:var(--accent);opacity:.28;transition:transform 4s ease-in-out}
.breath span{position:relative;font-size:16px}
.tip{display:flex;gap:10px;align-items:center;width:100%;text-align:start;border:1px solid var(--line);background:transparent;border-radius:10px;min-height:44px;padding:8px 12px;margin-bottom:8px}
.tip .bx{width:20px;height:20px;border:2px solid var(--line);border-radius:5px;flex:none;display:grid;place-items:center;font-size:13px;line-height:1}
.tip[aria-pressed="true"]{border-color:var(--good)}
.tip[aria-pressed="true"] .bx{background:var(--good);border-color:var(--good);color:var(--on-accent)}
#banner{max-width:960px;margin:10px auto 0}
.bn{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--accent-hi);border-radius:12px;padding:10px 14px;background:var(--surface)}
#toast{position:fixed;z-index:60;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:min(92vw,480px);background:var(--pop);border:1px solid var(--accent-hi);border-radius:12px;padding:10px 16px;font-size:15px}
.pr{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;margin-bottom:8px}
.kind{border:1px solid var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:12px}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.breath i{transition:none}}
@media (max-width:420px){.cell b{font-size:21px}.sc blockquote{font-size:22px}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>

function newDraft(){return {when:localInput(new Date()),place:[],state:[],outcome:'resisted',note:''}}

function relapses(){return S.logs.filter(function(l){return l.outcome==='relapse'&&l.ts>=S.startedAt}).map(function(l){return l.ts}).sort(function(a,b){return a-b})}
function calc(now){
  var r=relapses(),pts=[S.startedAt].concat(r),best=0,i,end;
  for(i=0;i<pts.length;i++){end=i<pts.length-1?pts[i+1]:now;best=Math.max(best,Math.floor((end-pts[i])/DAY))}
  var last=pts[pts.length-1],cur=Math.max(0,now-last),rd={};
  r.forEach(function(ts){rd[dkey(new Date(ts))]=1});
  var total=Math.floor((now-S.startedAt)/DAY);
  return {days:Math.floor(cur/DAY),hours:Math.floor(cur%DAY/36e5),mins:Math.floor(cur%36e5/6e4),best:best,clean:Math.max(0,total-Object.keys(rd).length),
    resisted:S.logs.filter(function(l){return l.outcome==='resisted'}).length};
}
function nextPrayer(now){
  var d=new Date(now),best=null;
  PR.forEach(function(k){var v=S.prayer[k];if(!v)return;var p=v.split(':');
    var t=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+p[0],+p[1]).getTime();if(t<=now)t+=DAY;
    if(!best||t<best.t)best={k:k,t:t}});
  return best;
}
function duePrayer(now){
  var d=new Date(now),out=null;
  PR.forEach(function(k){var v=S.prayer[k];if(!v)return;var p=v.split(':');
    var t=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+p[0],+p[1]).getTime();
    if(now>=t&&now<t+45*60000&&!S.prayerSeen[dkey(d)+k])out={k:k,key:dkey(d)+k}});
  return out;
}

    return '<button type="button" class="chip" aria-pressed="'+on+'" data-a="'+act+'" data-v="'+x[0]+'">'+esc(L(x[1],x[2]))+'</button>'}).join('')+'</div>';
}

function hourChart(counts){
  var W=480,H=150,pl=26,pb=22,pt=14,bw=(W-pl-4)/24,mx=Math.max.apply(null,counts.concat([1])),pk=counts.indexOf(Math.max.apply(null,counts)),s='';
  s+='<line x1="'+pl+'" y1="'+(H-pb)+'" x2="'+W+'" y2="'+(H-pb)+'" stroke="var(--line)"/>';
  s+='<text x="'+(pl-6)+'" y="'+(H-pb+4)+'" text-anchor="end">0</text><text x="'+(pl-6)+'" y="'+(pt+4)+'" text-anchor="end">'+mx+'</text>';
  counts.forEach(function(c,i){var bh=(H-pb-pt)*c/mx;
    if(c>0)s+='<rect x="'+(pl+i*bw+1.5)+'" y="'+(H-pb-bh)+'" width="'+(bw-3)+'" height="'+bh+'" rx="2" fill="'+(i===pk?'var(--craving)':'var(--accent)')+'"/>';
    if(i%6===0||i===23)s+='<text x="'+(pl+i*bw+bw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+i+'</text>';});
  return '<div class="chart" dir="ltr"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+L('عدد الرغبات حسب ساعة اليوم','Urges by hour of day')+'">'+s+'</svg></div>';
}
function dayChart(){
  var W=480,H=150,pl=26,pb=22,pt=14,n=14,bw=(W-pl-4)/n,s='',i,d,k,v,bh;
  s+='<line x1="'+pl+'" y1="'+(H-pb)+'" x2="'+W+'" y2="'+(H-pb)+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(H-pb+4)+'" text-anchor="end">0</text><text x="'+(pl-6)+'" y="'+(pt+4)+'" text-anchor="end">5</text>';
  for(i=0;i<n;i++){d=new Date(Date.now()-(n-1-i)*DAY);k=dkey(d);v=S.daily[k]&&typeof S.daily[k].desire==='number'?S.daily[k].desire:null;
    if(v!==null){bh=(H-pb-pt)*v/5;if(v>0)s+='<rect x="'+(pl+i*bw+3)+'" y="'+(H-pb-bh)+'" width="'+(bw-6)+'" height="'+bh+'" rx="2" fill="var(--accent)"/>';}
    else s+='<rect x="'+(pl+i*bw+3)+'" y="'+(H-pb-3)+'" width="'+(bw-6)+'" height="3" rx="1.5" fill="var(--line)"/>';
    if(i%2===0||i===n-1)s+='<text x="'+(pl+i*bw+bw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+d.getDate()+'</text>';}
  return '<div class="chart" dir="ltr"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+L('مستوى الرغبة آخر 14 يوم','Urge level over the last 14 days')+'">'+s+'</svg></div>';
}

function hashPin(pin,salt){
  var s=salt+':'+pin;
  if(window.crypto&&crypto.subtle&&window.TextEncoder)
    return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return (x<16?'0':'')+x.toString(16)}).join('')});
  var h=5381,i;for(i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;
  return Promise.resolve('f'+h);
}

function crTick(){

    case 'setpin':
      if(!/^\d{4,8}$/.test(ui.newPin)){ui.pinMsg=L('الرقم لازم يكون من 4 إلى 8 أرقام.','The PIN must be 4 to 8 digits.');render();break}
      var salt=uid();hashPin(ui.newPin,salt).then(function(h){S.pin={salt:salt,hash:h};ui.newPin='';ui.pinMsg=L('اتفعّل القفل.','Lock is on.');ui.unlocked=true;save();render()});break;
    case 'rmpin':S.pin=null;ui.pinMsg=L('اتشال القفل.','Lock removed.');save();render();break;
    case 'unlock':doUnlock();break;
    case 'backup':
      var txt=JSON.stringify(S);
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){ui.backupText='';toast(L('اتنسخت البيانات.','Data copied.'))},function(){ui.backupText=txt;render();var b=document.getElementById('bk');if(b){b.focus();b.select()}});break;
    case 'restore':
      try{var p=JSON.parse(ui.restoreText);if(!p||p.v!==1||!('startedAt' in p))throw 0;
        var n=clone(DEF);Object.keys(DEF).forEach(function(k){if(p[k]!==undefined)n[k]=p[k]});n.prayer=Object.assign({},DEF.prayer,p.prayer||{});
        S=n;ui.restoreText='';save();toast(L('اتسترجعت البيانات.','Data restored.'));render()}
      catch(x){toast(L('النص ده مش نسخة صالحة.','That text is not a valid backup.'))}break;
    case 'erase':
      if(ui.confirm==='erase'){try{localStorage.removeItem(KEY)}catch(x){}S=clone(DEF);ui.confirm=null;ui.view='home';ui.draft=null;ui.unlocked=true;render()}
      else{ui.confirm='erase';render();setTimeout(function(){if(ui.confirm==='erase'){ui.confirm=null;render()}},5000)}break;
    case 'crave':startCr();break;
    case 'tip':ui.cr.tips[v]=!ui.cr.tips[v];renderCr();break;
    case 'nextsc':ui.cr.si++;renderCr();break;
    case 'crdone':ui.cr.step='log';ui.cr.outcome=v;stopCr();renderCr();break;
    case 'cplace':toggle(ui.cr.place,v);renderCr();break;
    case 'cstate':toggle(ui.cr.state,v);renderCr();break;
    case 'crsave':
      var o=ui.cr.outcome;addLog({ts:Date.now(),place:ui.cr.place,state:ui.cr.state,outcome:o});
      closeLayer();toast(o==='relapse'?L('اتسجّلت. ارجع للخطة وكمّل.','Saved. Back to the plan, keep going.'):L('اتسجّلت. برافو.','Saved. Well done.'));render();break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target,i=t.getAttribute&&t.getAttribute('data-i');if(!i)return;
  if(i==='when')ui.draft.when=t.value;else if(i==='note')ui.draft.note=t.value;else if(i==='newReason')ui.reasonDraft=t.value;
  else if(i==='restoreText')ui.restoreText=t.value;else if(i==='newPin')ui.newPin=t.value;else if(i==='wDate')ui.wDate=t.value;
});
document.addEventListener('change',function(e){
  var t=e.target,i=t.getAttribute&&t.getAttribute('data-i');if(!i)return;
  if(i==='sleep'){daily().sleep=t.value?+t.value:null;save()}
  else if(i==='prayer'){S.prayer[t.getAttribute('data-k')]=t.value;save();updateLive()}
  else if(i==='startDate'){var d=new Date(t.value+'T00:00:00').getTime();if(d&&d<=Date.now()){S.startedAt=d;save();toast(L('اتعدّل تاريخ البداية.','Start date updated.'))}render()}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&document.querySelector('#layer .dlg')&&!(S.pin&&!ui.unlocked))closeLayer();
  if(e.key==='Enter'&&e.target.id==='pinIn')doUnlock();
});
function doUnlock(){
  var i=document.getElementById('pinIn');if(!i||!S.pin)return;
  hashPin(i.value,S.pin.salt).then(function(h){if(h===S.pin.hash){ui.unlocked=true;ui.pinErr=false;layer('');render()}else{ui.pinErr=true;lockLayer()}});
}
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(VIEWS[h]&&h!==ui.view&&S.startedAt&&(ui.unlocked||!S.pin)){ui.view=h;render()}});

/* ---------- boot ---------- */
(function(){var h=location.hash.slice(1);if(VIEWS[h])ui.view=h})();
if(S.pin){render();lockLayer()}else{ui.unlocked=true;render()}
setInterval(function(){if(ui.unlocked||!S.pin)updateLive()},20000);
})();
</script>

<script>
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
